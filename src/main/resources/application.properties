spring.application.name=student-management

# Base MySQL (XAMPP) : la base studentdb est créée automatiquement si elle n'existe pas
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Spring Data REST : endpoints automatiques sous /api pour ne pas entrer en conflit avec /students/...
spring.data.rest.base-path=/api

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
